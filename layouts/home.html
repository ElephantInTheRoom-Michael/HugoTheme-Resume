{{ define "head" }}

{{ end }}

{{ define "main" }}
    <article class="full-page-width-color">
        <header>
            {{ .Render "personal-details" }}
        </header>
        <section>
            {{ .Content }}
        </section>
    </article>
    {{ range .Site.Sections }}

    {{ end }}
{{ end }}
